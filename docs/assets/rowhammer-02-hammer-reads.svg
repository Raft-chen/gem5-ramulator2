<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#f7f8fb"/>
  <text x="48" y="58" font-family="Arial, sans-serif" font-size="30" fill="#1f2937">RowHammer access pattern: repeated ACT/RD/PRE</text>
  <text x="48" y="92" font-family="Arial, sans-serif" font-size="16" fill="#4b5563">The attacker repeatedly opens aggressor rows. Electrical disturbance accumulates in adjacent victim rows.</text>
  <g transform="translate(90 135)">
    <rect x="0" y="0" width="780" height="300" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="0" y="60" width="780" height="60" fill="#fff7ed"/>
    <rect x="0" y="180" width="780" height="60" fill="#fff7ed"/>
    <rect x="0" y="120" width="780" height="60" fill="#fef2f2"/>
    <g font-family="Arial, sans-serif" font-size="16" fill="#334155">
      <text x="-70" y="45">Aggressor</text>
      <text x="-52" y="105">Row A</text>
      <text x="-52" y="165">Victim</text>
      <text x="-52" y="225">Row B</text>
    </g>
    <g stroke="#cbd5e1">
      <line x1="0" y1="60" x2="780" y2="60"/>
      <line x1="0" y1="120" x2="780" y2="120"/>
      <line x1="0" y1="180" x2="780" y2="180"/>
      <line x1="0" y1="240" x2="780" y2="240"/>
    </g>
    <g font-family="Arial, sans-serif" font-size="18" font-weight="700">
      <text x="330" y="98" fill="#c2410c">ACT + RD repeated</text>
      <text x="330" y="218" fill="#c2410c">ACT + RD repeated</text>
      <text x="330" y="158" fill="#b91c1c">Victim row loses charge</text>
    </g>
    <g stroke="#f97316" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M280 90 C230 110 230 130 280 150"/>
      <path d="M280 210 C230 190 230 170 280 150"/>
    </g>
    <g>
      <rect x="25" y="80" width="42" height="24" rx="4" fill="#fb923c"/>
      <rect x="85" y="80" width="42" height="24" rx="4" fill="#fb923c"/>
      <rect x="145" y="80" width="42" height="24" rx="4" fill="#fb923c"/>
      <rect x="25" y="140" width="42" height="24" rx="4" fill="#ef4444"/>
      <rect x="85" y="140" width="42" height="24" rx="4" fill="#fca5a5"/>
      <rect x="145" y="140" width="42" height="24" rx="4" fill="#ef4444"/>
      <rect x="25" y="200" width="42" height="24" rx="4" fill="#fb923c"/>
      <rect x="85" y="200" width="42" height="24" rx="4" fill="#fb923c"/>
      <rect x="145" y="200" width="42" height="24" rx="4" fill="#fb923c"/>
    </g>
    <g transform="translate(530 38)">
      <rect x="0" y="0" width="180" height="86" rx="8" fill="#fff7ed" stroke="#f97316"/>
      <text x="18" y="34" font-family="Arial, sans-serif" font-size="16" fill="#9a3412">Many activations</text>
      <text x="18" y="62" font-family="Arial, sans-serif" font-size="16" fill="#9a3412">before refresh</text>
    </g>
  </g>
</svg>
