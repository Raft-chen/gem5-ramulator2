<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#f7f8fb"/>
  <text x="48" y="58" font-family="Arial, sans-serif" font-size="30" fill="#1f2937">DDR array: normal refresh, no data error</text>
  <text x="48" y="92" font-family="Arial, sans-serif" font-size="16" fill="#4b5563">Rows are activated occasionally. Regular refresh restores cell charge before data is lost.</text>
  <g transform="translate(90 135)">
    <rect x="0" y="0" width="780" height="300" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <g font-family="Arial, sans-serif" font-size="16" fill="#334155">
      <text x="-52" y="45">Row N-1</text>
      <text x="-52" y="105">Row N</text>
      <text x="-52" y="165">Row N+1</text>
      <text x="-52" y="225">Row N+2</text>
    </g>
    <g stroke="#cbd5e1">
      <line x1="0" y1="60" x2="780" y2="60"/>
      <line x1="0" y1="120" x2="780" y2="120"/>
      <line x1="0" y1="180" x2="780" y2="180"/>
      <line x1="0" y1="240" x2="780" y2="240"/>
    </g>
    <g>
      <rect x="25" y="20" width="42" height="24" rx="4" fill="#22c55e"/>
      <rect x="85" y="20" width="42" height="24" rx="4" fill="#22c55e"/>
      <rect x="145" y="20" width="42" height="24" rx="4" fill="#22c55e"/>
      <rect x="205" y="20" width="42" height="24" rx="4" fill="#22c55e"/>
      <rect x="25" y="80" width="42" height="24" rx="4" fill="#22c55e"/>
      <rect x="85" y="80" width="42" height="24" rx="4" fill="#22c55e"/>
      <rect x="145" y="80" width="42" height="24" rx="4" fill="#22c55e"/>
      <rect x="205" y="80" width="42" height="24" rx="4" fill="#22c55e"/>
      <rect x="25" y="140" width="42" height="24" rx="4" fill="#22c55e"/>
      <rect x="85" y="140" width="42" height="24" rx="4" fill="#22c55e"/>
      <rect x="145" y="140" width="42" height="24" rx="4" fill="#22c55e"/>
      <rect x="205" y="140" width="42" height="24" rx="4" fill="#22c55e"/>
      <rect x="25" y="200" width="42" height="24" rx="4" fill="#22c55e"/>
      <rect x="85" y="200" width="42" height="24" rx="4" fill="#22c55e"/>
      <rect x="145" y="200" width="42" height="24" rx="4" fill="#22c55e"/>
      <rect x="205" y="200" width="42" height="24" rx="4" fill="#22c55e"/>
    </g>
    <g transform="translate(510 58)">
      <rect x="0" y="0" width="190" height="108" rx="8" fill="#ecfeff" stroke="#06b6d4"/>
      <text x="18" y="35" font-family="Arial, sans-serif" font-size="17" fill="#155e75">Refresh interval</text>
      <text x="18" y="65" font-family="Arial, sans-serif" font-size="15" fill="#155e75">Charge restored</text>
      <text x="18" y="90" font-family="Arial, sans-serif" font-size="15" fill="#155e75">Data remains stable</text>
    </g>
  </g>
</svg>
