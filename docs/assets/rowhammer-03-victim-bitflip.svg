<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#f7f8fb"/>
  <text x="48" y="58" font-family="Arial, sans-serif" font-size="30" fill="#1f2937">Victim-row data flip</text>
  <text x="48" y="92" font-family="Arial, sans-serif" font-size="16" fill="#4b5563">If disturbance exceeds the retention margin before mitigation, a victim bit can change value.</text>
  <g transform="translate(90 135)">
    <rect x="0" y="0" width="780" height="300" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="0" y="120" width="780" height="60" fill="#fef2f2"/>
    <g font-family="Arial, sans-serif" font-size="16" fill="#334155">
      <text x="-52" y="105">Row A</text>
      <text x="-52" y="165">Victim</text>
      <text x="-52" y="225">Row B</text>
    </g>
    <g stroke="#cbd5e1">
      <line x1="0" y1="60" x2="780" y2="60"/>
      <line x1="0" y1="120" x2="780" y2="120"/>
      <line x1="0" y1="180" x2="780" y2="180"/>
      <line x1="0" y1="240" x2="780" y2="240"/>
    </g>
    <g font-family="Arial, sans-serif" font-size="18" font-weight="700">
      <text x="310" y="158" fill="#b91c1c">Bit flip in victim row</text>
    </g>
    <g>
      <rect x="35" y="140" width="58" height="28" rx="4" fill="#22c55e"/>
      <text x="53" y="160" font-family="Arial, sans-serif" font-size="16" fill="#052e16">1</text>
      <rect x="115" y="140" width="58" height="28" rx="4" fill="#22c55e"/>
      <text x="133" y="160" font-family="Arial, sans-serif" font-size="16" fill="#052e16">1</text>
      <rect x="195" y="140" width="58" height="28" rx="4" fill="#dc2626"/>
      <text x="213" y="160" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">0</text>
      <path d="M224 126 L224 103" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
      <path d="M212 115 L224 103 L236 115" stroke="#dc2626" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
    <g transform="translate(505 70)">
      <rect x="0" y="0" width="210" height="128" rx="8" fill="#fef2f2" stroke="#ef4444"/>
      <text x="18" y="34" font-family="Arial, sans-serif" font-size="17" fill="#991b1b">System-level risk</text>
      <text x="18" y="64" font-family="Arial, sans-serif" font-size="15" fill="#991b1b">Silent data corruption</text>
      <text x="18" y="91" font-family="Arial, sans-serif" font-size="15" fill="#991b1b">Privilege escalation</text>
      <text x="18" y="116" font-family="Arial, sans-serif" font-size="15" fill="#991b1b">RAS reliability failure</text>
    </g>
  </g>
</svg>
